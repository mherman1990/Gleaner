manifestVersion: 1
id: herman-gleaner
name: Gleaner
tagline: Handwritten reMarkable notes become an open-loop task list
icon: https://raw.githubusercontent.com/mherman1990/spotter-umbrel-store/main/herman-gleaner/icon.svg
category: productivity
version: "0.2.0"
port: 3717
description: >-
  Gleaner reads the notebooks in one folder of your reMarkable (/Daily by
  default), transcribes each changed page with Claude, and keeps a ledger of
  the commitments you wrote down. Notes are saved as dated markdown in this
  app's data folder on your Umbrel. The outside services are the reMarkable
  cloud (through rmapi, which needs Connect) and the Anthropic API, using a
  key you add to gleaner.env.


  Features:

  - Only changed pages are transcribed, and the nightly run uses the Batch
  API at half price

  - Every open item gets a number; write ✓14, x14 or 14 → Fri on the tablet
  to close, drop or snooze it

  - An item you rewrite on a later day is linked to the original, and the
  days you've carried it are counted

  - A Today sheet PDF lands on the tablet each weekday morning

  - Due and overdue nudges to Teams or ntfy, plus a Sunday weekly review

  - A token-protected API for Claude and scripts: open items, notes by date,
  search


  Setup after install: put ANTHROPIC_API_KEY in gleaner.env in the app's
  data folder, register rmapi once with a code from your reMarkable account,
  and create an API token for each client. The README has the steps.
developer: Matt Herman
website: https://github.com/mherman1990/Gleaner
repo: https://github.com/mherman1990/Gleaner
support: https://github.com/mherman1990/Gleaner/issues
gallery: []
path: ""
dependencies: []
defaultUsername: ""
defaultPassword: ""
storage:
  dataRoot: data
# Pulled notebooks and page renders are re-created on the next ingest.
backupIgnore:
  - data/raw/*
  - data/renders/*
releaseNotes: >-
  A projects file (projects.yaml in the data folder) gives tags aliases,
  maps people's short names to full names, and can mark a project
  restricted. Each API client now gets its own token and scopes (see the
  README); a token marked normal never sees restricted projects, and your
  existing GLEANER_API_TOKEN keeps working. Every change to an item is
  logged with who made it, and the morning digest says who closed what.
  Handwriting: a line moved to another page keeps its number, striking a
  line cancels its task, a done task written again is a new item, a reopen
  by hand sticks, and a page erased blank or deleted drops its open tasks.
  Ingest now waits for the read to finish and says what it found.
submitter: Matt Herman
submission: https://github.com/mherman1990/Gleaner
