name: Release

# Push a tag like v0.2.0 (matching package.json) to publish the multi-arch image to GHCR and,
# if configured, update Gleaner in the Herman Apps Umbrel store (the same store repo as Spotter).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/gleaner

jobs:
  image:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches package.json
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match package.json version $pkg"; exit 1
          fi
          echo "version=$pkg" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summary
        run: |
          {
            echo "### Published"
            echo '```'
            echo "${IMAGE}:${{ steps.version.outputs.version }}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  store:
    # Copies umbrel-store/herman-gleaner/ into the store repo, pins the new digest, and pushes.
    # Needs the STORE_REPO variable (mherman1990/spotter-umbrel-store) and a STORE_REPO_TOKEN
    # secret (fine-grained PAT with contents:write on that repo).
    #
    # Only the herman-gleaner/ folder is Gleaner's. The store's README.md and
    # umbrel-app-store.yml come from the spotter repo's umbrel-store/, which Spotter's own
    # release syncs; never copy them from here.
    needs: image
    if: vars.STORE_REPO != ''
    runs-on: ubuntu-24.04
    # One Gleaner store update at a time, and an older release that finishes last never
    # replaces a newer one (see the version check below).
    concurrency:
      group: umbrel-store
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          path: app
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.STORE_REPO }}
          token: ${{ secrets.STORE_REPO_TOKEN }}
          path: store
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Sync and bump
        run: |
          current="$(sed -n 's/^version: "\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' store/herman-gleaner/umbrel-app.yml 2>/dev/null || true)"
          if [ -n "$current" ] && [ "$(printf '%s\n%s\n' "$current" "${{ needs.image.outputs.version }}" | sort -V | tail -1)" != "${{ needs.image.outputs.version }}" ]; then
            echo "Store already has $current; not replacing it with ${{ needs.image.outputs.version }}."
            exit 0
          fi
          mkdir -p store/herman-gleaner
          rsync -a --delete app/umbrel-store/herman-gleaner/ store/herman-gleaner/
          node app/scripts/bump-store.mjs --store store \
            --version "${{ needs.image.outputs.version }}" \
            --digest "${{ needs.image.outputs.digest }}" \
            --image "${IMAGE}"
          node app/scripts/check-store.mjs store
      - name: Commit
        working-directory: store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "herman-gleaner ${{ needs.image.outputs.version }}"
          # Spotter's release pushes to the same repo but never touches herman-gleaner/,
          # so if it got there first, rebasing onto it always applies cleanly.
          for attempt in 1 2 3; do
            git push && exit 0
            sleep $((attempt * 5))
            git pull --rebase
          done
          exit 1
