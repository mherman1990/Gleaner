# Multi-arch image for Umbrel (arm64 for the Pi 5, amd64 for dev). Push a tag like v0.1.0 to publish
# ghcr.io/<owner>/gleaner:0.1.0, then pin that digest in umbrel/docker-compose.yml.
name: Image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/gleaner
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Digest to pin in umbrel/docker-compose.yml
        run: echo "ghcr.io/${{ github.repository_owner }}/gleaner@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
