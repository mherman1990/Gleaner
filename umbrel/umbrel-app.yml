# Drop this folder into the same community app store repo as Spotter, renamed to <store-id>-gleaner/.
manifestVersion: 1
id: CHANGE-ME-gleaner            # must be <your store id>-gleaner, matching the folder name
category: productivity
name: Gleaner
version: "0.1.0"
tagline: Handwritten reMarkable notes → transcribed notes, open loops, and reminders
description: >-
  Pulls the /Daily folder from your reMarkable cloud, transcribes changed pages with Claude,
  keeps a ledger of open loops, pushes a Today sheet back to the tablet each morning, and sends
  due/overdue nudges to Teams or ntfy. Notes are stored as markdown on this device.
developer: Matt Herman
website: ""
dependencies: []
repo: ""
support: ""
port: 3717
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: "Initial release."
submitter: Matt Herman
submission: ""
